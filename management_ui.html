<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TabSQL SQL Console</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #1e1e2e; --surface: #2a2a3e; --border: #3a3a5a;
  --accent: #7c9ef8; --text: #cdd6f4; --muted: #6e6e8e;
  --hover: #313145; --green: #a6e3a1; --red: #f38ba8;
}
body { background: var(--bg); color: var(--text); font: 13px/1.5 'JetBrains Mono', 'Consolas', monospace;
       display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
header { padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--border);
         display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 14px; color: var(--accent); }
.pill { font-size: 11px; background: var(--hover); border: 1px solid var(--border);
        border-radius: 10px; padding: 2px 10px; color: var(--muted); }
#main { display: flex; flex: 1; overflow: hidden; }
#sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border);
           overflow-y: auto; padding: 8px 0; flex-shrink: 0; }
#sidebar h3 { font-size: 11px; color: var(--muted); padding: 4px 12px; text-transform: uppercase; letter-spacing: .06em; }
.sq { padding: 5px 12px; cursor: pointer; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sq:hover { background: var(--hover); color: var(--accent); }
#editor-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#sql-input { flex-shrink: 0; background: var(--surface); border: none; border-bottom: 1px solid var(--border);
             color: var(--text); font: 13px 'JetBrains Mono','Consolas',monospace;
             padding: 10px 14px; resize: none; height: 110px; outline: none; }
#run-bar { display: flex; align-items: center; gap: 8px; padding: 6px 14px;
           background: var(--surface); border-bottom: 1px solid var(--border); }
.btn { background: var(--hover); border: 1px solid var(--border); color: var(--text);
       border-radius: 4px; padding: 4px 12px; cursor: pointer; font-size: 12px; }
.btn.primary { background: var(--accent); color: #1e1e2e; border-color: var(--accent); font-weight: 600; }
.btn:hover { filter: brightness(1.15); }
#status { font-size: 11px; color: var(--muted); margin-left: auto; }
#results { flex: 1; overflow: auto; padding: 0; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { background: var(--surface); color: var(--accent); text-align: left; padding: 6px 10px;
     position: sticky; top: 0; border-bottom: 1px solid var(--border); }
td { padding: 4px 10px; border-bottom: 1px solid #2a2a3e; max-width: 400px;
     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tr:hover td { background: var(--hover); }
.err { color: var(--red); padding: 14px; }
.null { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>TabSQL SQL Console</h1>
  <span class="pill" id="backend-pill">connecting…</span>
</header>
<div id="main">
  <div id="sidebar">
    <h3>Quick queries</h3>
    <div class="sq" data-sql="SELECT node_type, COUNT(*) c FROM node GROUP BY node_type ORDER BY c DESC">Node counts by type</div>
    <div class="sq" data-sql="SELECT * FROM window_summary ORDER BY tab_count DESC">Window summary</div>
    <div class="sq" data-sql="SELECT * FROM tab_flat LIMIT 100">Tab flat view (100)</div>
    <div class="sq" data-sql="SELECT * FROM node WHERE note_text IS NOT NULL ORDER BY updated_at DESC">All notes</div>
    <div class="sq" data-sql="SELECT * FROM node WHERE is_open=1 ORDER BY node_type, position">Open nodes</div>
    <div class="sq" data-sql="SELECT url, COUNT(*) c FROM node WHERE url IS NOT NULL GROUP BY url HAVING c>1 ORDER BY c DESC">Duplicate URLs</div>
    <div class="sq" data-sql="SELECT * FROM node WHERE custom_title IS NOT NULL ORDER BY node_type">Custom-titled nodes</div>
    <div class="sq" data-sql="SELECT * FROM node ORDER BY created_at DESC LIMIT 50">Recently added (50)</div>
    <div class="sq" data-sql="SELECT * FROM node WHERE url LIKE '%github%' LIMIT 100">GitHub tabs</div>
    <div class="sq" data-sql="DELETE FROM node WHERE node_type='savedtab' AND url IS NULL">Delete null-URL savedtabs</div>
  </div>
  <div id="editor-pane">
    <textarea id="sql-input" spellcheck="false" placeholder="SELECT * FROM node LIMIT 20;
-- Ctrl+Enter to run"></textarea>
    <div id="run-bar">
      <button class="btn primary" id="run-btn">▶ Run (Ctrl+Enter)</button>
      <button class="btn" id="clear-btn">Clear</button>
      <button class="btn" id="export-btn">Export CSV</button>
      <span id="status"></span>
    </div>
    <div id="results"></div>
  </div>
</div>

<script>
let lastRows = [];

function bgSend(cmd, payload) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('background not responding (timeout)')), 8000);
    chrome.runtime.sendMessage({ to: 'background', cmd, payload }, r => {
      clearTimeout(timer);
      if (chrome.runtime.lastError) return reject(new Error(chrome.runtime.lastError.message));
      if (!r?.ok) return reject(new Error(r?.error ?? 'Unknown error'));
      resolve(r.data);
    });
  });
}

async function runSQL(sql) {
  const t0 = Date.now();
  document.getElementById('status').textContent = 'Running…';
  try {
    const r = await bgSend('bulk_exec', { sql });
    const elapsed = Date.now() - t0;
    if (!r.ok) throw new Error(r.error);
    lastRows = r.rows ?? [];
    renderTable(lastRows);
    document.getElementById('status').textContent =
      `${lastRows.length} row${lastRows.length===1?'':'s'} · ${elapsed}ms`;
  } catch(e) {
    document.getElementById('results').innerHTML = `<div class="err">Error: ${escHtml(e.message)}</div>`;
    document.getElementById('status').textContent = 'Error';
    lastRows = [];
  }
}

function renderTable(rows) {
  if (!rows.length) {
    document.getElementById('results').innerHTML = '<div class="err" style="color:var(--muted)">No rows returned.</div>';
    return;
  }
  const cols = Object.keys(rows[0]);
  const header = `<tr>${cols.map(c=>`<th>${escHtml(c)}</th>`).join('')}</tr>`;
  const body = rows.map(row =>
    `<tr>${cols.map(c => {
      const v = row[c];
      if (v === null || v === undefined) return `<td class="null">NULL</td>`;
      return `<td title="${escHtml(String(v))}">${escHtml(String(v))}</td>`;
    }).join('')}</tr>`
  ).join('');
  document.getElementById('results').innerHTML = `<table><thead>${header}</thead><tbody>${body}</tbody></table>`;
}

function exportCSV() {
  if (!lastRows.length) return;
  const cols = Object.keys(lastRows[0]);
  const lines = [cols.join(','), ...lastRows.map(r =>
    cols.map(c => JSON.stringify(r[c] ?? '')).join(',')
  )];
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tabsql_query.csv';
  a.click();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Events
document.getElementById('run-btn').addEventListener('click', () => {
  const sql = document.getElementById('sql-input').value.trim();
  if (sql) runSQL(sql);
});
document.getElementById('sql-input').addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter') {
    const sql = document.getElementById('sql-input').value.trim();
    if (sql) runSQL(sql);
  }
});
document.getElementById('clear-btn').addEventListener('click', () => {
  document.getElementById('results').innerHTML = '';
  document.getElementById('status').textContent = '';
  lastRows = [];
});
document.getElementById('export-btn').addEventListener('click', exportCSV);
document.querySelectorAll('.sq').forEach(el => {
  el.addEventListener('click', () => {
    document.getElementById('sql-input').value = el.dataset.sql;
    runSQL(el.dataset.sql);
  });
});

document.getElementById('backend-pill').textContent = 'in-browser sqlite';
runSQL('SELECT node_type, COUNT(*) c FROM node GROUP BY node_type ORDER BY c DESC');
</script>
</body>
</html>
